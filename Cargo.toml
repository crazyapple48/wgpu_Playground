[package]
name = "playground"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "playground-bin"
path = "src/main.rs"

# if WASM struggles to build, get rid of this
[profile.release]
strip = true


[dependencies]
wgpu = "30.0"
pollster = "0.3"
env_logger = "0.10"
anyhow = "1.0"
log = "0.4"
winit = { version = "0.30"}

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.6"
console_log = "1.0"
wgpu = { version = "30.0", features = ["webgl"]}
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.30"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element"
]}
